# PostgreSQL Configuration for Protein Docking Ultra-Performance
# Optimizado para máximo rendimiento en operaciones de docking molecular

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
port = 5432
max_connections = 300
superuser_reserved_connections = 10

# Authentication
authentication_timeout = 1min
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

# Memory
shared_buffers = 2GB                    # 25% of RAM for 8GB system
huge_pages = try
temp_buffers = 32MB
work_mem = 16MB                         # Para operaciones de sorting complejas
hash_mem_multiplier = 2.0
maintenance_work_mem = 512MB            # Para VACUUM, CREATE INDEX, etc.
autovacuum_work_mem = 512MB
dynamic_shared_memory_type = posix

# Memory for complex queries (protein docking analytics)
effective_cache_size = 6GB             # 75% of total RAM
shared_preload_libraries = 'pg_stat_statements,pg_buffercache'

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fdatasync
full_page_writes = on
wal_compression = on

# WAL sizing
wal_buffers = 64MB
wal_writer_delay = 200ms
commit_delay = 0
commit_siblings = 5

# Checkpoints
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB
checkpoint_warning = 30s

# Archiving (para backup)
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 1h

# WAL sizing for high-throughput protein data
min_wal_size = 2GB
max_wal_size = 8GB

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------

max_wal_senders = 10
max_replication_slots = 10
track_commit_timestamp = off

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Parallel Query Configuration
max_worker_processes = 16
max_parallel_workers_per_gather = 8
max_parallel_workers = 16
max_parallel_maintenance_workers = 8
parallel_leader_participation = on

# Cost-based Optimizer
random_page_cost = 1.1                 # Para SSD storage
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
effective_io_concurrency = 300         # Para múltiples drives SSD

# Query Planning
default_statistics_target = 500        # Estadísticas más precisas para queries complejas
constraint_exclusion = partition
cursor_tuple_fraction = 0.1
from_collapse_limit = 8
join_collapse_limit = 8
geqo = on
geqo_threshold = 12

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

# Logging Configuration
log_destination = 'stderr,csvlog'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# When to Log
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000      # Log queries > 1 second

# What to Log
log_checkpoints = on
log_connections = off
log_disconnections = off
log_duration = off
log_error_verbosity = default
log_hostname = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on                     # Log lock waits
log_statement = 'none'
log_replication_commands = off
log_temp_files = 10MB

# Process Title
cluster_name = 'protein-docking-cluster'
update_process_title = on

#------------------------------------------------------------------------------
# RUNTIME STATISTICS
#------------------------------------------------------------------------------

# Query and Index Statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
track_wal_io_timing = on
stats_temp_directory = '/var/run/postgresql/stats_temp'

# Statement Statistics (para pg_stat_statements)
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

autovacuum = on
log_autovacuum_min_duration = 1000     # Log autovacuum operations > 1s
autovacuum_max_workers = 4
autovacuum_naptime = 30s               # Más frecuente para alta actividad
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_insert_threshold = 1000
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1   # 10% de la tabla
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05 # 5% para análisis más frecuente
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 200

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Statement Behavior
search_path = '"$user", public'
row_security = on
default_tablespace = ''
temp_tablespaces = ''

# Locale and Formatting
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
timezone = 'UTC'
timezone_abbreviations = 'Default'
extra_float_digits = 1
client_encoding = utf8

# Shared Library Preloading
local_preload_libraries = ''
session_preload_libraries = ''

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2

#------------------------------------------------------------------------------
# VERSION AND PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------

array_nulls = on
backslash_quote = safe_encoding
default_with_oids = off
escape_string_warning = on
lo_compat_privileges = off
operator_precedence_warning = off
quote_all_identifiers = off
standard_conforming_strings = on
synchronize_seqscans = on

#------------------------------------------------------------------------------
# ERROR HANDLING
#------------------------------------------------------------------------------

exit_on_error = off
restart_after_crash = on
data_sync_retry = off

#------------------------------------------------------------------------------
# CUSTOM OPTIONS FOR PROTEIN DOCKING
#------------------------------------------------------------------------------

# Configuraciones específicas para workloads de docking molecular
shared_buffers = 2GB                   # Buffer cache grande para estructuras de proteínas
effective_cache_size = 6GB             # Cache del OS para archivos de proteínas
random_page_cost = 1.1                 # Optimizado para almacenamiento SSD
work_mem = 16MB                        # Memoria para operaciones de sorting de coordenadas
maintenance_work_mem = 512MB           # Para índices espaciales grandes

# Optimizaciones para consultas analíticas complejas
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

# Configuración JIT para queries complejas
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000