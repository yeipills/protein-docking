apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "protein-docking.fullname" . }}-backend
  labels:
    {{- include "protein-docking.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ .Values.replicaCount.backend }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "protein-docking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "protein-docking.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "protein-docking.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.gpu.enabled }}
      runtimeClassName: {{ .Values.gpu.runtime }}
      {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.gpu.enabled }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.backendGpu.repository }}:{{ .Values.image.backendGpu.tag }}"
          {{- else }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
            {{- if .Values.gpu.enabled }}
            - name: gpu-metrics
              containerPort: 8082
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.healthChecks.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthChecks.backend.readinessProbe | nindent 12 }}
          env:
            # Standard environment variables
            {{- range $key, $value := .Values.env.backend }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            
            {{- if .Values.gpu.enabled }}
            # GPU-specific environment variables
            {{- range $key, $value := .Values.envGpu.backend }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            
            # Database connection
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: database-url
            
            # Redis connection
            - name: REDIS_CLUSTER_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "protein-docking.fullname" . }}-config
                  key: redis-urls
          
          resources:
            {{- if .Values.gpu.enabled }}
            {{- toYaml .Values.resources.backendGpu | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources.backend | nindent 12 }}
            {{- end }}
          
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/results
            - name: cache
              mountPath: /app/cache
            {{- if .Values.gpu.enabled }}
            - name: gpu-cache
              mountPath: /app/gpu-cache
            {{- end }}
      
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "protein-docking.fullname" . }}-uploads
        - name: results
          persistentVolumeClaim:
            claimName: {{ include "protein-docking.fullname" . }}-results
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "protein-docking.fullname" . }}-cache
        {{- if .Values.gpu.enabled }}
        - name: gpu-cache
          emptyDir:
            sizeLimit: 10Gi
        {{- end }}
      
      {{- if .Values.gpu.enabled }}
      nodeSelector:
        {{- toYaml .Values.gpu.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations.gpu | nindent 8 }}
      {{- else }}
      {{- with .Values.nodeAffinity.backend }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}