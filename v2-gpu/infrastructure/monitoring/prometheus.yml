# Prometheus Configuration - Ultra-optimized for protein docking monitoring
# Configuración optimizada para monitoreo de máximo rendimiento

global:
  scrape_interval: 5s          # Frecuencia alta para métricas críticas
  evaluation_interval: 5s     # Evaluación de alertas frecuente
  scrape_timeout: 4s          # Timeout rápido para detectar problemas
  external_labels:
    cluster: 'protein-docking-v2'
    environment: 'production'
    instance_type: 'high-performance'

# Configuración de almacenamiento optimizada
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Configuración de alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Jobs de scraping optimizados para protein docking
scrape_configs:
  # Backend Rust - Métricas de alto rendimiento
  - job_name: 'protein-docking-backend'
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 2s         # Muy frecuente para cálculos críticos
    scrape_timeout: 1s
    metrics_path: '/metrics'
    params:
      module: ['default']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'backend-rust'
    metric_relabel_configs:
      # Optimizar métricas críticas
      - source_labels: [__name__]
        regex: 'protein_docking_(computation_time|throughput|gpu_utilization|memory_usage).*'
        target_label: __tmp_priority
        replacement: 'critical'

  # Frontend Svelte - Métricas de UI/UX
  - job_name: 'protein-docking-frontend'
    static_configs:
      - targets: ['frontend:3000']
    scrape_interval: 10s        # Menos crítico que backend
    scrape_timeout: 5s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'frontend-svelte'

  # PostgreSQL - Métricas de base de datos
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'database-postgres'

  # Redis Cluster - Métricas de cache distribuido
  - job_name: 'redis-cluster'
    static_configs:
      - targets: 
        - 'redis-1:6379'
        - 'redis-2:6380'
        - 'redis-3:6381'
    scrape_interval: 5s         # Cache crítico para performance
    scrape_timeout: 3s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        regex: 'redis-(\d+):(\d+)'
        target_label: redis_node
        replacement: 'node-${1}'
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'cache-redis'

  # ClickHouse - Métricas de analytics
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    scrape_interval: 30s        # Analytics menos críticos
    scrape_timeout: 15s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'analytics-clickhouse'

  # Nginx - Métricas de load balancer
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'loadbalancer-nginx'

  # Node Exporter - Métricas del sistema
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s         # Sistema crítico para performance
    scrape_timeout: 3s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_type
        replacement: 'system-metrics'
    metric_relabel_configs:
      # Optimizar métricas de sistema más relevantes
      - source_labels: [__name__]
        regex: 'node_(cpu|memory|disk|network).*'
        target_label: __tmp_system_critical
        replacement: 'true'

  # Prometheus auto-monitoreo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 15s

  # Grafana métricas
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 60s
    scrape_timeout: 30s

# Configuración de retención optimizada
storage:
  tsdb:
    retention.time: 30d          # 30 días de datos históricos
    retention.size: 50GB         # Límite de almacenamiento
    min-block-duration: 2h      # Blocks más pequeños para mejor compresión
    max-block-duration: 25h     # Máximo duración de block
    wal-compression: true        # Compresión WAL habilitada

# Recording rules para métricas agregadas de alto rendimiento
rule_files:
  - "/etc/prometheus/rules/protein_docking_rules.yml"
  - "/etc/prometheus/rules/performance_rules.yml"
  - "/etc/prometheus/rules/sla_rules.yml"

# Remote write para backup y análisis avanzado (opcional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
#     queue_config:
#       capacity: 10000
#       max_shards: 200
#       min_shards: 1
#       max_samples_per_send: 5000
#       batch_send_deadline: 10s

# Remote read para consultas históricas (opcional)
# remote_read:
#   - url: "https://prometheus-remote-read-endpoint.com/api/v1/read"

# Configuración de performance para alta carga
# Optimizado para sistemas con muchas métricas y alta frecuencia
tracing:
  # Habilitar tracing para debugging avanzado
  enable: false

# Configuración de feature flags
feature_flags:
  - enable-auto-gomemlimit      # Auto-gestión de memoria Go
  - enable-exemplar-storage     # Storage de ejemplares para mejores métricas

# Configuración de logging
log:
  level: info                   # Nivel de logging para producción
  format: json                  # Formato JSON para mejor parsing