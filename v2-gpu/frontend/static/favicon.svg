<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Protein structure representation -->
  <circle cx="16" cy="16" r="14" fill="url(#grad)" opacity="0.2"/>
  
  <!-- Central molecule -->
  <circle cx="16" cy="16" r="3" fill="#00ff88"/>
  
  <!-- Orbital electrons/atoms -->
  <circle cx="8" cy="12" r="2" fill="#00ccff"/>
  <circle cx="24" cy="12" r="2" fill="#00ccff"/>
  <circle cx="8" cy="20" r="2" fill="#00ccff"/>
  <circle cx="24" cy="20" r="2" fill="#00ccff"/>
  
  <!-- Bonds -->
  <line x1="16" y1="16" x2="8" y2="12" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="16" x2="24" y2="12" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="16" x2="8" y2="20" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="16" x2="24" y2="20" stroke="#fff" stroke-width="1" opacity="0.6"/>
</svg>