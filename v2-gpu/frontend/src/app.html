<!doctype html>
<html lang="en" class="%sveltekit.theme%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ultra-high performance protein docking application" />
    <meta name="keywords" content="protein, docking, molecular, biology, bioinformatics, high-performance" />
    <meta name="author" content="Protein Docking Team" />
    
    <!-- Performance optimizations -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    
    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="//localhost:8080" />
    
    <!-- Critical CSS inline (will be injected by Svelte) -->
    <style>
      /* Critical styles para evitar FOUC */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        overflow-x: hidden;
      }
      
      /* Loading spinner inicial */
      .initial-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #00ff88;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loader when app loads */
      .app-loaded .initial-loader {
        display: none;
      }
    </style>
    
    <!-- Performance monitoring (opcional) -->
    <script>
      // Early performance tracking
      window.__PERF_START__ = performance.now();
      
      // Feature detection
      window.__FEATURES__ = {
        webgl: !!window.WebGLRenderingContext,
        webgl2: !!window.WebGL2RenderingContext,
        webassembly: typeof WebAssembly === 'object',
        workers: typeof Worker !== 'undefined',
        sharedArrayBuffer: typeof SharedArrayBuffer !== 'undefined',
        offscreenCanvas: typeof OffscreenCanvas !== 'undefined'
      };
    </script>
    
    %sveltekit.head%
  </head>
  
  <body data-sveltekit-preload-data="off" class="bg-gray-900 text-white">
    <!-- Initial loading indicator -->
    <div class="initial-loader">
      <div class="spinner"></div>
    </div>
    
    <!-- Main app container -->
    <div id="app" style="display: contents">%sveltekit.body%</div>
    
    <!-- Performance tracking script -->
    <script>
      // Track app load time
      window.addEventListener('load', () => {
        const loadTime = performance.now() - window.__PERF_START__;
        console.log(`App loaded in ${loadTime.toFixed(2)}ms`);
        
        // Add loaded class to body
        document.body.classList.add('app-loaded');
        
        // Optional: Send performance metrics
        if (window.__ANALYTICS__) {
          window.__ANALYTICS__.track('app_load_time', { duration: loadTime });
        }
      });
      
      // Service worker disabled temporarily due to development issues
      // if ('serviceWorker' in navigator) {
      //   navigator.serviceWorker.register('/service-worker.js');
      // }
    </script>
  </body>
</html>
