services:
  cshape:
    build: .
    image: cshape:3
    ports:
      - "8080:8080"
    environment:
      # Set a token to require it for every API call (recommended outside localhost).
      CSHAPE_TOKEN: ${CSHAPE_TOKEN:-}
    volumes:
      - cshape-data:/app/var
    restart: unless-stopped

volumes:
  cshape-data:
