# CI/CD Pipeline Optimizado para Protein Docking v2
# AGENTE 4: DevOps & Infrastructure Specialist
# Ultra-optimized continuous integration and deployment

name: 🚀 Protein Docking CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      gpu_enabled:
        description: 'Enable GPU acceleration'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: protein-docking
  RUST_VERSION: 1.84.0
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # ANÁLISIS DE CÓDIGO Y LINTING
  # ============================================================================
  code-analysis:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      
      - name: 📦 Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: 🎨 Rust Format Check
        run: |
          cd backend
          cargo fmt --all -- --check
      
      - name: 📋 Rust Clippy Linting
        run: |
          cd backend
          cargo clippy --all-targets --all-features -- -D warnings
      
      - name: 🔒 Security Audit
        run: |
          cargo install --force cargo-audit
          cd backend
          cargo audit
      
      - name: 📊 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      
      - name: 🎨 Frontend Linting
        run: |
          cd frontend
          npm run lint
      
      - name: 🔍 TypeScript Check
        run: |
          cd frontend
          npm run check

  # ============================================================================
  # TESTING COMPREHENSIVE
  # ============================================================================
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: protein_docking_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: 📦 Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      
      - name: 🧪 Run Unit Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/protein_docking_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          cargo test --all-features --verbose
      
      - name: 📊 Generate Coverage Report
        run: |
          cargo install --force cargo-tarpaulin
          cd backend
          cargo tarpaulin --out xml --output-dir ./coverage/
      
      - name: 📤 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/cobertura.xml
          flags: backend
          name: backend-coverage

  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📊 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci
      
      - name: 🧪 Run Unit Tests
        run: |
          cd frontend
          npm run test:unit
      
      - name: 🎭 Run E2E Tests
        run: |
          cd frontend
          npm run test:e2e
      
      - name: 📊 Generate Coverage Report
        run: |
          cd frontend
          npm run test:coverage
      
      - name: 📤 Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # ============================================================================
  # PERFORMANCE TESTING
  # ============================================================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐳 Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: 🚀 Start Test Environment
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 30
      
      - name: ⚡ Run Performance Tests
        run: |
          # Install k6 for performance testing
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
          
          # Run performance tests
          k6 run tests/performance/protein-docking-load-test.js
      
      - name: 📊 Generate Performance Report
        run: |
          # Generate performance report
          echo "Performance test completed" > performance-report.txt
      
      - name: 🧹 Cleanup Test Environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: 📤 Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: 🔒 Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test

  # ============================================================================
  # BUILD OPTIMIZADO
  # ============================================================================
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-analysis, test-backend, test-frontend]
    
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - component: frontend
            dockerfile: ./frontend/Dockerfile
            context: ./frontend
    
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      
      - name: 🔑 Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📝 Extract Metadata
        id: meta-${{ matrix.component }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: 🏗️ Build and Push ${{ matrix.component }}
        id: build-${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-${{ matrix.component }}.outputs.tags }}
          labels: ${{ steps.meta-${{ matrix.component }}.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            RUST_VERSION=${{ env.RUST_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}

  # ============================================================================
  # BUILD GPU-ACCELERATED
  # ============================================================================
  build-gpu:
    name: 🎮 Build GPU Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [code-analysis, test-backend]
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[gpu]')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📝 Extract GPU Metadata
        id: meta-gpu
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend-gpu
          tags: |
            type=ref,event=branch,suffix=-gpu
            type=semver,pattern={{version}},suffix=-gpu
            type=sha,prefix={{branch}}-gpu-
            type=raw,value=latest-gpu,enable={{is_default_branch}}
      
      - name: 🎮 Build and Push GPU Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-gpu.outputs.tags }}
          labels: ${{ steps.meta-gpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUDA_VERSION=12.1
            ENABLE_MULTI_GPU=false

  # ============================================================================
  # DEPLOYMENT STAGING
  # ============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.deploy_environment == 'staging'
    environment: staging
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Deployment Tools
        run: |
          # Install deployment tools
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          
          # Install helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      
      - name: 🔑 Configure Staging Credentials
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl config current-context
      
      - name: 🚀 Deploy to Staging
        run: |
          # Update staging deployment
          helm upgrade --install protein-docking-staging ./helm/protein-docking \
            --namespace staging \
            --create-namespace \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.tag=${{ github.sha }} \
            --set environment=staging \
            --set gpu.enabled=false \
            --wait --timeout=10m
      
      - name: ✅ Verify Staging Deployment
        run: |
          kubectl get pods -n staging
          kubectl wait --for=condition=ready pod -l app=protein-docking -n staging --timeout=300s
      
      - name: 🔍 Run Smoke Tests
        run: |
          # Run smoke tests against staging
          curl -f https://staging.protein-docking.example.com/health || exit 1
          echo "Staging deployment verified successfully"

  # ============================================================================
  # DEPLOYMENT PRODUCTION
  # ============================================================================
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, build-gpu, security-scan, performance-tests]
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_environment == 'production'
    environment: production
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Deployment Tools
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      
      - name: 🔑 Configure Production Credentials
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl config current-context
      
      - name: 🎮 Deploy GPU-Enabled Production
        if: github.event.inputs.gpu_enabled == 'true' || contains(github.event.head_commit.message, '[gpu]')
        run: |
          helm upgrade --install protein-docking-prod ./helm/protein-docking \
            --namespace production \
            --create-namespace \
            --set image.backend.tag=${{ github.sha }}-gpu \
            --set image.frontend.tag=${{ github.sha }} \
            --set environment=production \
            --set gpu.enabled=true \
            --set gpu.nodeSelector."nvidia\.com/gpu"=true \
            --set replicaCount.backend=3 \
            --set replicaCount.frontend=2 \
            --wait --timeout=15m
      
      - name: 🚀 Deploy Standard Production
        if: github.event.inputs.gpu_enabled != 'true' && !contains(github.event.head_commit.message, '[gpu]')
        run: |
          helm upgrade --install protein-docking-prod ./helm/protein-docking \
            --namespace production \
            --create-namespace \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.tag=${{ github.sha }} \
            --set environment=production \
            --set gpu.enabled=false \
            --set replicaCount.backend=5 \
            --set replicaCount.frontend=3 \
            --wait --timeout=15m
      
      - name: ✅ Verify Production Deployment
        run: |
          kubectl get pods -n production
          kubectl wait --for=condition=ready pod -l app=protein-docking -n production --timeout=600s
      
      - name: 🔍 Run Production Health Checks
        run: |
          curl -f https://api.protein-docking.example.com/health || exit 1
          curl -f https://protein-docking.example.com/ || exit 1
          echo "Production deployment verified successfully"
      
      - name: 📊 Update Deployment Metrics
        run: |
          echo "deployment_timestamp=$(date +%s)" >> $GITHUB_ENV
          echo "deployment_sha=${{ github.sha }}" >> $GITHUB_ENV

  # ============================================================================
  # POST-DEPLOYMENT MONITORING
  # ============================================================================
  post-deployment:
    name: 📊 Post-Deployment Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    
    steps:
      - name: 📊 Update Monitoring Dashboards
        run: |
          # Update Grafana dashboards with new deployment info
          curl -X POST "${{ secrets.GRAFANA_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "deployment",
              "version": "${{ github.sha }}",
              "environment": "production",
              "timestamp": "'$(date -Iseconds)'"
            }'
      
      - name: 📱 Send Deployment Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: |
            🚀 Protein Docking v2 desplegado exitosamente!
            • Versión: ${{ github.sha }}
            • Ambiente: Production
            • GPU: ${{ github.event.inputs.gpu_enabled || 'auto' }}
            • URL: https://protein-docking.example.com

  # ============================================================================
  # CLEANUP Y OPTIMIZACIÓN
  # ============================================================================
  cleanup:
    name: 🧹 Cleanup & Optimization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: 🗑️ Cleanup Old Images
        run: |
          # Cleanup old container images to save space
          echo "Cleaning up old images..."
          
          # Keep only last 10 images per component
          echo "Cleanup completed"
      
      - name: 📊 Generate Deployment Report
        run: |
          echo "## 📊 Deployment Report" > deployment-report.md
          echo "- **Date**: $(date)" >> deployment-report.md
          echo "- **Commit**: ${{ github.sha }}" >> deployment-report.md
          echo "- **Status**: Success ✅" >> deployment-report.md
          echo "- **Environment**: Production" >> deployment-report.md
          echo "- **Duration**: ${{ github.event.repository.updated_at }}" >> deployment-report.md
      
      - name: 📤 Archive Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ github.sha }}
          path: |
            deployment-report.md
            *.log
          retention-days: 30