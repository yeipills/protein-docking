<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="proteinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#proteinGradient)"/>

  <!-- Protein structure representation (simplified DNA helix-like) -->
  <g fill="white" opacity="0.9">
    <!-- Left strand -->
    <circle cx="35" cy="30" r="4"/>
    <circle cx="32" cy="40" r="4"/>
    <circle cx="35" cy="50" r="4"/>
    <circle cx="32" cy="60" r="4"/>
    <circle cx="35" cy="70" r="4"/>

    <!-- Right strand -->
    <circle cx="65" cy="30" r="4"/>
    <circle cx="68" cy="40" r="4"/>
    <circle cx="65" cy="50" r="4"/>
    <circle cx="68" cy="60" r="4"/>
    <circle cx="65" cy="70" r="4"/>

    <!-- Connecting bonds -->
    <line x1="35" y1="30" x2="65" y2="30" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="32" y1="40" x2="68" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="35" y1="50" x2="65" y2="50" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="32" y1="60" x2="68" y2="60" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="35" y1="70" x2="65" y2="70" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Letter P overlay -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.3">P</text>
</svg>
