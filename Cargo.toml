[workspace]
resolver = "3"
members = ["crates/cs-core", "crates/cshape"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cs-core = { path = "crates/cs-core" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
