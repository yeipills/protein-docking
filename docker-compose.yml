# Docker Compose for Protein Docking Platform
# Production configuration

version: '3.8'

services:
  # =====================================
  # Database - PostgreSQL
  # =====================================
  postgres:
    image: postgres:15-alpine
    container_name: protein_docking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # ⚠️ PRODUCTION: DO NOT EXPOSE - use docker-compose.dev.yml for dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Redis - Message broker and cache
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: protein_docking_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"  # ⚠️ PRODUCTION: DO NOT EXPOSE - use docker-compose.dev.yml for dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Backend API - FastAPI
  # =====================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protein_docking_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --workers 4
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
      - results:/app/results
      - logs:/app/logs
    # ports:
    #   - "5000:5000"  # ⚠️ PRODUCTION: Accessed via Nginx proxy only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Socket Server - Flask-SocketIO
  # =====================================
  socket:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protein_docking_socket
    command: python socket_server/app.py
    env_file:
      - .env
    volumes:
      - ./backend/socket_server:/app/socket_server
      - logs:/app/logs
    # ports:
    #   - "8080:8080"  # ⚠️ PRODUCTION: Accessed via Nginx proxy only
    depends_on:
      - backend
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Celery Worker - Task processing
  # =====================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protein_docking_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
      - results:/app/results
      - logs:/app/logs
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Frontend - React + TypeScript + Vite
  # =====================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protein_docking_frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost/api/v1}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost}
      - VITE_ENV=production
    # ports:
    #   - "3000:3000"  # ⚠️ PRODUCTION: Served via Nginx on port 80/443
    depends_on:
      - backend
      - socket
    networks:
      - protein_network
    restart: unless-stopped

  # =====================================
  # Nginx - Reverse Proxy
  # =====================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: protein_docking_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - socket
      - frontend
    networks:
      - protein_network
    restart: unless-stopped

# =====================================
# Networks
# =====================================
networks:
  protein_network:
    driver: bridge

# =====================================
# Volumes
# =====================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  results:
    driver: local
  logs:
    driver: local
