# Nginx Ultra-Optimized Configuration for Protein Docking
# Load balancer, reverse proxy y static file serving

user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
# load_module modules/ngx_http_geoip_module.so;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

# HTTP configuration optimized for bioinformatics workloads
http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Timeouts optimized for large protein file uploads
    keepalive_timeout 75s;
    keepalive_requests 1000;
    client_body_timeout 300s;  # Large protein files
    client_header_timeout 60s;
    send_timeout 300s;
    
    # Buffer sizes for large protein data
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_max_body_size 500M;  # Large PDB files
    large_client_header_buffers 4 16k;
    
    # File upload optimization
    client_body_in_file_only off;
    client_body_in_single_buffer on;
    
    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Add custom MIME types for bioinformatics
    location ~* \.(pdb|mol|sdf|mol2)$ {
        add_header Content-Type "chemical/x-pdb";
    }

    # Logging optimized
    log_format main_performance '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main_performance buffer=16k flush=1s;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/plain
        text/css
        text/xml
        text/javascript
        application/xml
        application/wasm;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript;

    # Rate limiting for API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=5r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 20;

    # SSL/TLS Configuration (for HTTPS)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';" always;

    # Upstream servers configuration
    upstream backend_servers {
        least_conn;  # Load balancing algorithm
        server backend:8080 max_fails=3 fail_timeout=30s weight=1;
        # Add more backend servers for horizontal scaling:
        # server backend2:8080 max_fails=3 fail_timeout=30s weight=1;
        # server backend3:8080 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 32;  # Keep connections alive
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream frontend_servers {
        server frontend:3000 max_fails=2 fail_timeout=20s;
        # Add more frontend servers if needed:
        # server frontend2:3000 max_fails=2 fail_timeout=20s;
        
        keepalive 16;
    }

    # Cache configuration
    proxy_cache_path /var/cache/nginx/protein_cache levels=1:2 keys_zone=protein_cache:100m 
                     max_size=1g inactive=60m use_temp_path=off;

    # Map for caching static resources
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  1h;
        text/css                   1y;
        application/javascript     1y;
        application/wasm          1y;
        ~image/                    1M;
        application/font-woff      1M;
        application/font-woff2     1M;
    }

    # Main server block
    server {
        listen 80;
        listen [::]:80;
        server_name localhost protein-docking.local;
        
        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;
        
        # Root directory
        root /var/www/html;
        index index.html;

        # Security: Hide nginx version
        server_tokens off;

        # Frontend routing (Svelte SPA)
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Fallback for SPA routing
            try_files $uri $uri/ @fallback;
        }

        # API routing to backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API timeouts (longer for complex calculations)
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;  # 10 minutes for heavy docking
            proxy_read_timeout 600s;
            
            # Buffer settings for large responses
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 16 16k;
            proxy_busy_buffers_size 32k;
            
            # Disable caching for API calls
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # WebSocket support for real-time updates
        location /ws {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;  # 1 hour for long-running jobs
            proxy_read_timeout 3600s;
            
            # Disable buffering for real-time communication
            proxy_buffering off;
        }

        # File upload endpoint with special handling
        location /api/v1/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Large file upload settings
            client_max_body_size 500M;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;  # 30 minutes for large files
            proxy_read_timeout 1800s;
        }

        # File download with caching
        location /api/v1/download {
            limit_req zone=download_limit burst=10 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cache downloaded files
            proxy_cache protein_cache;
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_key $scheme$proxy_host$request_uri;
            
            # Add cache headers
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Static assets with aggressive caching
        location ~* \.(css|js|wasm|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            expires $expires;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            # Try serving static files directly, fallback to frontend
            try_files $uri @fallback;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint for monitoring
        location /metrics {
            proxy_pass http://backend_servers/metrics;
            allow 172.20.0.0/16;  # Only allow from docker network
            deny all;
        }

        # Fallback for SPA
        location @fallback {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Security: Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /var/www/html;
        }
    }

    # HTTPS server block (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name protein-docking.local;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     # Include all the location blocks from above
    #     # ... (copy all location blocks from HTTP server)
    # }

    # Monitoring and stats (for ops team)
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.20.0.0/16;  # Docker network only
            deny all;
        }
    }
}