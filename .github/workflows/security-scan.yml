name: Security Vulnerability Scan

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install security scanning tools
        run: |
          pip install pip-audit bandit safety
          echo "Security tools installed"

      - name: Scan Python dependencies with pip-audit
        id: pip-audit
        continue-on-error: true
        run: |
          cd backend
          pip-audit -r requirements.txt --format json --output ../pip-audit-results.json || true
          pip-audit -r requirements.txt || true

      - name: Scan Python code with Bandit
        id: bandit
        continue-on-error: true
        run: |
          cd backend
          bandit -r app/ -f json -o ../bandit-results.json || true
          bandit -r app/ || true

      - name: Scan frontend dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          cd frontend
          npm audit --json > ../npm-audit-results.json || true
          npm audit || true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            pip-audit-results.json
            bandit-results.json
            npm-audit-results.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."

          # Check pip-audit results
          if [ -f pip-audit-results.json ]; then
            VULN_COUNT=$(python3 -c "import json; data=json.load(open('pip-audit-results.json')); print(sum(len(d['vulns']) for d in data.get('dependencies', [])))")
            echo "Python dependencies: $VULN_COUNT vulnerabilities found"

            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "::warning::Found $VULN_COUNT vulnerabilities in Python dependencies"
            fi
          fi

          # Check bandit results
          if [ -f bandit-results.json ]; then
            HIGH_COUNT=$(python3 -c "import json; data=json.load(open('bandit-results.json')); print(data.get('metrics', {}).get('_totals', {}).get('SEVERITY.HIGH', 0))")
            echo "Python code: $HIGH_COUNT high severity issues found"

            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::warning::Found $HIGH_COUNT high severity issues in Python code"
            fi
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🛡️ Security Scan Results\n\n';

            // Read pip-audit results
            if (fs.existsSync('pip-audit-results.json')) {
              const pipAudit = JSON.parse(fs.readFileSync('pip-audit-results.json', 'utf8'));
              const vulnCount = pipAudit.dependencies.reduce((sum, dep) => sum + dep.vulns.length, 0);
              comment += `### Python Dependencies\n`;
              comment += `- **Vulnerabilities found:** ${vulnCount}\n\n`;
            }

            // Read bandit results
            if (fs.existsSync('bandit-results.json')) {
              const bandit = JSON.parse(fs.readFileSync('bandit-results.json', 'utf8'));
              const totals = bandit.metrics._totals;
              comment += `### Python Code Analysis\n`;
              comment += `- **High severity:** ${totals['SEVERITY.HIGH'] || 0}\n`;
              comment += `- **Medium severity:** ${totals['SEVERITY.MEDIUM'] || 0}\n`;
              comment += `- **Low severity:** ${totals['SEVERITY.LOW'] || 0}\n\n`;
            }

            // Read npm audit results
            if (fs.existsSync('npm-audit-results.json')) {
              const npmAudit = JSON.parse(fs.readFileSync('npm-audit-results.json', 'utf8'));
              const vulns = npmAudit.metadata?.vulnerabilities || {};
              comment += `### Frontend Dependencies\n`;
              comment += `- **Critical:** ${vulns.critical || 0}\n`;
              comment += `- **High:** ${vulns.high || 0}\n`;
              comment += `- **Moderate:** ${vulns.moderate || 0}\n`;
              comment += `- **Low:** ${vulns.low || 0}\n\n`;
            }

            comment += `\n📄 See [SECURITY_AUDIT_REPORT.md](../blob/${context.sha}/SECURITY_AUDIT_REPORT.md) for details.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
