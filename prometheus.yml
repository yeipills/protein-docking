# Prometheus Configuration
# Scrapes metrics from the Protein Docking Platform backend

global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'protein-docking-platform'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'backend-api'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'backend-api'
          component: 'fastapi'

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    # Uncomment when postgres_exporter is added to docker-compose
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: instance
    #     replacement: postgres

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    # Uncomment when redis_exporter is added to docker-compose
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: instance
    #     replacement: redis

  # Node metrics (system-level metrics)
  # Requires node_exporter running on the host
  # - job_name: 'node'
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'
  #         component: 'system'

  # Celery worker metrics (requires custom exporter or prometheus_client in workers)
  # - job_name: 'celery'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['celery-exporter:9808']
  #       labels:
  #         service: 'celery'
  #         component: 'workers'
