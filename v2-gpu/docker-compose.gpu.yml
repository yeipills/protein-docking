# Docker Compose GPU Configuration
# AGENTE 4: DevOps & Infrastructure Specialist  
# Ultra-optimized GPU-accelerated protein docking system

# Configuración de redes optimizada para GPU
networks:
  protein-docking-gpu:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "9000"  # Jumbo frames for GPU data transfer

# Volúmenes optimizados para GPU workloads
volumes:
  # GPU cache y kernels compilados
  gpu_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/gpu-cache
  
  gpu_kernels:
    driver: local
    driver_opts:
      type: none
      o: bind  
      device: ./data/gpu-kernels

  # Base de datos optimizada para SSD/NVMe
  postgres_data_gpu:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres-gpu

  # Storage de alta velocidad para resultados GPU
  results_nvme:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/results-nvme

  # Uploads optimizados
  uploads_ssd:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads-ssd

services:
  # ====================================================================
  # BACKEND GPU-ACCELERATED - Multi-GPU Support
  # ====================================================================
  backend-gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
      target: production-multi-gpu
      args:
        CUDA_VERSION: "12.1"
        ENABLE_MULTI_GPU: "false"
        GPU_ARCH: "6.0 6.1 7.0 7.5 8.0 8.6 8.9 9.0"
    
    container_name: protein-docking-backend-gpu
    hostname: backend-gpu
    restart: unless-stopped
    
    # GPU configuration
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      
      # CUDA Configuration
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_CACHE_PATH=/app/gpu-cache
      - CUDA_LAUNCH_BLOCKING=0
      - CUDA_DEVICE_MAX_CONNECTIONS=32
      
      # GPU Memory Management
      - GPU_MEMORY_POOL_SIZE=12GB
      - GPU_MAX_CONCURRENT_KERNELS=128
      - GPU_MEMORY_FRACTION=0.95
      - GPU_BATCH_SIZE=2048
      
      # Multi-GPU Configuration
      - NCCL_DEBUG=WARN
      - NCCL_SOCKET_IFNAME=eth0
      - NCCL_IB_DISABLE=1
      - NCCL_P2P_DISABLE=0
      
      # Performance Configuration
      - RUST_LOG=info,protein_docking_backend=debug
      - TOKIO_WORKER_THREADS=32
      - RAYON_NUM_THREADS=32
      
      # Protein Docking Specific
      - PROTEIN_DOCKING_ENABLE_GPU=true
      - PROTEIN_DOCKING_ENABLE_MULTI_GPU=false
      - PROTEIN_DOCKING_ENABLE_CUDA=true
      - PROTEIN_DOCKING_GPU_BATCH_SIZE=2048
      - PROTEIN_DOCKING_MAX_CONCURRENT_JOBS=16
      - PROTEIN_DOCKING_MEMORY_POOL_SIZE=16GB
      
      # Database & Cache
      - DATABASE_URL=postgresql://protein_user:secure_protein_pass_2024@postgres-gpu:5432/protein_docking
      - REDIS_CLUSTER_URLS=redis://redis-gpu-1:6379,redis://redis-gpu-2:6380,redis://redis-gpu-3:6381
    
    # Puertos
    ports:
      - "8080:8080"
      - "8081:8081"  # Metrics
      - "8082:8082"  # GPU metrics
    
    # Volúmenes para GPU
    volumes:
      - gpu_cache:/app/gpu-cache
      - gpu_kernels:/app/gpu-kernels
      - uploads_ssd:/app/uploads
      - results_nvme:/app/results
      - ./logs/backend-gpu:/app/logs
    
    # Dependencias
    depends_on:
      postgres-gpu:
        condition: service_healthy
      redis-gpu-1:
        condition: service_started
      redis-gpu-2:
        condition: service_started
      redis-gpu-3:
        condition: service_started
    
    # Red
    networks:
      - protein-docking-gpu
    
    # Límites de recursos para GPU
    deploy:
      resources:
        limits:
          cpus: '24.0'
          memory: 32G
        reservations:
          cpus: '16.0'
          memory: 24G
          generic_resources:
            - discrete_resource_spec:
                kind: 'gpu'
                value: 1  # Reserve 1 GPU
    
    # Health check optimizado para GPU
    healthcheck:
      test: ["CMD", "protein-docking-server", "--health-check", "--gpu-check"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 120s
    
    # Security context
    security_opt:
      - seccomp:unconfined
    
    # Privileged mode for GPU access
    privileged: false
    
    # IPC mode for multi-GPU communication
    ipc: host

  # ====================================================================
  # POSTGRESQL GPU-OPTIMIZED
  # ====================================================================
  postgres-gpu:
    image: postgres:16-alpine
    container_name: protein-docking-postgres-gpu
    hostname: postgres-gpu
    restart: unless-stopped
    
    ports:
      - "5432:5432"
    
    environment:
      - POSTGRES_DB=protein_docking
      - POSTGRES_USER=protein_user
      - POSTGRES_PASSWORD=secure_protein_pass_2024
      - POSTGRES_INITDB_ARGS=--data-checksums --encoding=UTF8 --locale=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data_gpu:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
      - ./infrastructure/postgres/postgresql-gpu.conf:/etc/postgresql/postgresql.conf
      - ./logs/postgres-gpu:/var/log/postgresql
    
    networks:
      - protein-docking-gpu
    
    # Optimizado para workloads GPU (más memoria, más paralelismo)
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements,pg_buffercache
      -c max_connections=500
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c maintenance_work_mem=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=128MB
      -c work_mem=32MB
      -c max_worker_processes=32
      -c max_parallel_workers_per_gather=16
      -c max_parallel_workers=32
      -c effective_io_concurrency=1000
      -c random_page_cost=1.0
    
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protein_user -d protein_docking"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ====================================================================
  # REDIS CLUSTER GPU-OPTIMIZED
  # ====================================================================
  redis-gpu-1:
    image: redis:7-alpine
    container_name: protein-docking-redis-gpu-1
    hostname: redis-gpu-1
    restart: unless-stopped
    
    ports:
      - "6379:6379"
      - "16379:16379"
    
    volumes:
      - ./data/redis-gpu/node1:/data
      - ./infrastructure/redis/redis-gpu-node-1.conf:/usr/local/etc/redis/redis.conf
    
    networks:
      protein-docking-gpu:
        ipv4_address: 172.31.0.10
    
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 15000
      --cluster-announce-ip 172.31.0.10
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-gpu-2:
    image: redis:7-alpine
    container_name: protein-docking-redis-gpu-2
    hostname: redis-gpu-2
    restart: unless-stopped
    
    ports:
      - "6380:6380"
      - "16380:16380"
    
    volumes:
      - ./data/redis-gpu/node2:/data
      - ./infrastructure/redis/redis-gpu-node-2.conf:/usr/local/etc/redis/redis.conf
    
    networks:
      protein-docking-gpu:
        ipv4_address: 172.31.0.11
    
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6380
      --cluster-enabled yes
      --cluster-config-file nodes-6380.conf
      --cluster-node-timeout 15000
      --cluster-announce-ip 172.31.0.11
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-gpu-3:
    image: redis:7-alpine
    container_name: protein-docking-redis-gpu-3
    hostname: redis-gpu-3
    restart: unless-stopped
    
    ports:
      - "6381:6381"
      - "16381:16381"
    
    volumes:
      - ./data/redis-gpu/node3:/data
      - ./infrastructure/redis/redis-gpu-node-3.conf:/usr/local/etc/redis/redis.conf
    
    networks:
      protein-docking-gpu:
        ipv4_address: 172.31.0.12
    
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --port 6381
      --cluster-enabled yes
      --cluster-config-file nodes-6381.conf
      --cluster-node-timeout 15000
      --cluster-announce-ip 172.31.0.12
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cluster GPU Initializer
  redis-gpu-cluster-init:
    image: redis:7-alpine
    container_name: protein-docking-redis-gpu-cluster-init
    depends_on:
      - redis-gpu-1
      - redis-gpu-2
      - redis-gpu-3
    networks:
      - protein-docking-gpu
    command: >
      sh -c "
        sleep 30 &&
        redis-cli --cluster create 
        172.31.0.10:6379 
        172.31.0.11:6380 
        172.31.0.12:6381 
        --cluster-replicas 0 
        --cluster-yes
      "
    restart: "no"

  # ====================================================================
  # FRONTEND CON SOPORTE PARA GPU METRICS
  # ====================================================================
  frontend-gpu:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: protein-docking-frontend-gpu
    hostname: frontend-gpu
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_WS_URL=ws://localhost:8080/ws
      - VITE_GPU_METRICS_URL=http://localhost:8082/metrics
      - VITE_ENABLE_GPU_MONITORING=true
    
    depends_on:
      backend-gpu:
        condition: service_healthy
    
    networks:
      - protein-docking-gpu
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # ====================================================================
  # NVIDIA GPU MONITORING
  # ====================================================================
  nvidia-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:0.1
    container_name: protein-docking-nvidia-exporter
    hostname: nvidia-exporter
    restart: unless-stopped
    
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    
    ports:
      - "9445:9445"
    
    networks:
      - protein-docking-gpu
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ====================================================================
  # DCGM EXPORTER PARA MÉTRICAS GPU AVANZADAS
  # ====================================================================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: protein-docking-dcgm-exporter
    hostname: dcgm-exporter
    restart: unless-stopped
    
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    
    ports:
      - "9400:9400"
    
    networks:
      - protein-docking-gpu
    
    cap_add:
      - SYS_ADMIN
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ====================================================================
  # PROMETHEUS CON CONFIGURACIÓN GPU
  # ====================================================================
  prometheus-gpu:
    image: prom/prometheus:v2.48.0
    container_name: protein-docking-prometheus-gpu
    hostname: prometheus-gpu
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./data/prometheus-gpu:/prometheus
      - ./infrastructure/monitoring/prometheus-gpu.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/rules-gpu:/etc/prometheus/rules
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=200GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--query.max-concurrency=100'
      - '--query.timeout=60s'
    
    networks:
      - protein-docking-gpu
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # ====================================================================
  # GRAFANA CON DASHBOARDS GPU
  # ====================================================================
  grafana-gpu:
    image: grafana/grafana:10.2.0
    container_name: protein-docking-grafana-gpu
    hostname: grafana-gpu
    restart: unless-stopped
    
    ports:
      - "3001:3000"
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=secure_grafana_pass_2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,grafana-worldmap-panel,natel-discrete-panel
    
    volumes:
      - ./data/grafana-gpu:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-gpu/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana-gpu/datasources:/etc/grafana/provisioning/datasources
      - ./logs/grafana-gpu:/var/log/grafana
    
    depends_on:
      - prometheus-gpu
    
    networks:
      - protein-docking-gpu
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ====================================================================
  # NGINX LOAD BALANCER CON GPU AWARENESS
  # ====================================================================
  nginx-gpu:
    image: nginx:alpine
    container_name: protein-docking-nginx-gpu
    hostname: nginx-gpu
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"
    
    volumes:
      - ./infrastructure/nginx/nginx-gpu.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx-gpu:/var/log/nginx
    
    depends_on:
      backend-gpu:
        condition: service_healthy
      frontend-gpu:
        condition: service_healthy
    
    networks:
      - protein-docking-gpu
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

# ====================================================================
# CONFIGURACIONES GLOBALES GPU
# ====================================================================

# Configuración x-gpu común
x-gpu-config: &gpu-config
  runtime: nvidia
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility

# Configuración x-logging para GPU
x-gpu-logging: &gpu-logging
  driver: "json-file"
  options:
    max-size: "200m"
    max-file: "10"
    labels: "service,environment,gpu"