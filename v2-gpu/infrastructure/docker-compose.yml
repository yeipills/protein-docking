# Docker Compose - Ultra-optimized protein docking infrastructure
# Orquestación completa para máximo rendimiento

version: '3.8'

networks:
  protein-docking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data_1:
    driver: local
  redis_data_2:
    driver: local
  redis_data_3:
    driver: local
  clickhouse_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # Backend Rust ultra-optimizado
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: protein-docking-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - TOKIO_WORKER_THREADS=16
      - RAYON_NUM_THREADS=16
      - DATABASE_URL=postgresql://protein_user:protein_pass@postgres:5432/protein_docking
      - REDIS_CLUSTER_URLS=redis://redis-1:6379,redis://redis-2:6380,redis://redis-3:6381
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      - postgres
      - redis-1
      - redis-2
      - redis-3
      - clickhouse
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
    networks:
      - protein-docking-network
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G

  # Frontend Svelte optimizado
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: protein-docking-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080/ws
    depends_on:
      - backend
    networks:
      - protein-docking-network

  # PostgreSQL optimizado
  postgres:
    image: postgres:15-alpine
    container_name: protein-docking-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=protein_docking
      - POSTGRES_USER=protein_user
      - POSTGRES_PASSWORD=protein_pass
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - protein-docking-network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis Cluster Node 1
  redis-1:
    image: redis:7-alpine
    container_name: protein-docking-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_1:/data
      - ./infrastructure/redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    networks:
      - protein-docking-network
    command: redis-server /usr/local/etc/redis/redis.conf --port 6379 --cluster-announce-ip redis-1

  # Redis Cluster Node 2
  redis-2:
    image: redis:7-alpine
    container_name: protein-docking-redis-2
    restart: unless-stopped
    ports:
      - "6380:6380"
    volumes:
      - redis_data_2:/data
      - ./infrastructure/redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    networks:
      - protein-docking-network
    command: redis-server /usr/local/etc/redis/redis.conf --port 6380 --cluster-announce-ip redis-2

  # Redis Cluster Node 3
  redis-3:
    image: redis:7-alpine
    container_name: protein-docking-redis-3
    restart: unless-stopped
    ports:
      - "6381:6381"
    volumes:
      - redis_data_3:/data
      - ./infrastructure/redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    networks:
      - protein-docking-network
    command: redis-server /usr/local/etc/redis/redis.conf --port 6381 --cluster-announce-ip redis-3

  # ClickHouse para analytics
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: protein-docking-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=protein_docking_analytics
      - CLICKHOUSE_USER=analytics_user
      - CLICKHOUSE_PASSWORD=analytics_pass
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./infrastructure/clickhouse/protein_docking_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - protein-docking-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: protein-docking-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Status monitoring
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - protein-docking-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: protein-docking-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - protein-docking-network

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: protein-docking-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=protein_admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - protein-docking-network

  # Node Exporter para métricas del sistema
  node-exporter:
    image: prom/node-exporter:latest
    container_name: protein-docking-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - protein-docking-network

  # Redis Exporter para métricas de cache
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: protein-docking-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis-1:6379,redis://redis-2:6380,redis://redis-3:6381
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    networks:
      - protein-docking-network

  # Postgres Exporter para métricas de BD
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: protein-docking-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://protein_user:protein_pass@postgres:5432/protein_docking?sslmode=disable
    depends_on:
      - postgres
    networks:
      - protein-docking-network