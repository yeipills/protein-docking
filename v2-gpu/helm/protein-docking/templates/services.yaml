---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "protein-docking.fullname" . }}-backend
  labels:
    {{- include "protein-docking.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if .Values.gpu.enabled }}
    - port: 8082
      targetPort: gpu-metrics
      protocol: TCP
      name: gpu-metrics
    {{- end }}
  selector:
    {{- include "protein-docking.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "protein-docking.fullname" . }}-frontend
  labels:
    {{- include "protein-docking.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "protein-docking.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "protein-docking.fullname" . }}-metrics
  labels:
    {{- include "protein-docking.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if .Values.gpu.enabled }}
    - port: 8082
      targetPort: gpu-metrics
      protocol: TCP
      name: gpu-metrics
    {{- end }}
  selector:
    {{- include "protein-docking.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}