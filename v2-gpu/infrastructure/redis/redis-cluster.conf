# Redis Cluster Configuration - Ultra-optimized for protein docking cache
# Configuración optimizada para cache distribuido de máximo rendimiento

# Network configuration
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
tcp-keepalive 300

# Cluster configuration
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no
cluster-migration-barrier 1

# Memory optimization for large protein structures
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence configuration (optimized for performance)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF configuration for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Logging
loglevel notice
logfile /var/log/redis/redis.log
syslog-enabled yes
syslog-ident redis-cluster

# Client settings optimized for protein docking workloads
timeout 300
tcp-keepalive 300
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance tuning
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Advanced optimizations
activerehashing yes
hz 10
dynamic-hz yes
rdb-save-incremental-fsync yes
aof-rewrite-incremental-fsync yes

# Security (básica para desarrollo)
# requirepass protein-docking-secret

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Memory usage optimization
replica-lazy-flush yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Networking optimizations
tcp-keepalive 300