# Pre-commit hooks for Protein Docking Platform
# Automatically format and lint code before commits
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Manual run:
#   pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in docker-compose
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Python - Black formatter
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        language_version: python3.11
        files: ^backend/

  # Python - isort (import sorting)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^backend/

  # Python - flake8 (linting)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=100'
          - '--extend-ignore=E203,W503'
          - '--exclude=.git,__pycache__,build,dist,*.egg-info'
        files: ^backend/

  # Frontend - Prettier (formatter)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|css|json|md)$
        exclude: ^(package-lock\.json|node_modules)
        args: ['--write']

  # TypeScript - ESLint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0-beta.2
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        args: ['--fix']
        additional_dependencies:
          - 'eslint@^9.11.1'
          - '@typescript-eslint/eslint-plugin@^8.7.0'
          - '@typescript-eslint/parser@^8.7.0'

# Configure which files to exclude globally
exclude: |
  (?x)^(
      \.git/|
      node_modules/|
      \.venv/|
      __pycache__/|
      \.pytest_cache/|
      \.mypy_cache/|
      dist/|
      build/|
      \.egg-info/|
      frontend/dist/|
      backend/alembic/versions/
  )
