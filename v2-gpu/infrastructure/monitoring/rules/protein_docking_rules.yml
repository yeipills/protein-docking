# Protein Docking Recording Rules - Métricas agregadas para máximo rendimiento
# Optimizado para monitoreo de protein docking en tiempo real

groups:
  # Métricas de rendimiento de docking críticas
  - name: protein_docking_performance
    interval: 5s
    rules:
      # Throughput de docking jobs por segundo
      - record: protein_docking:jobs_per_second
        expr: rate(protein_docking_jobs_completed_total[1m])
        labels:
          metric_type: "throughput"
          priority: "critical"

      # Tiempo promedio de computación por job
      - record: protein_docking:avg_computation_time_seconds
        expr: rate(protein_docking_computation_time_seconds_sum[5m]) / rate(protein_docking_computation_time_seconds_count[5m])
        labels:
          metric_type: "latency"
          priority: "critical"

      # Utilización promedio de GPU
      - record: protein_docking:gpu_utilization_avg
        expr: avg(protein_docking_gpu_utilization_percent) by (instance, gpu_id)
        labels:
          metric_type: "resource"
          priority: "high"

      # Utilización promedio de CPU (todos los cores)
      - record: protein_docking:cpu_utilization_avg
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
        labels:
          metric_type: "resource"
          priority: "high"

      # Memory usage del sistema de docking
      - record: protein_docking:memory_usage_percent
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
        labels:
          metric_type: "resource"
          priority: "high"

      # Tasa de éxito de jobs de docking
      - record: protein_docking:success_rate
        expr: rate(protein_docking_jobs_completed_total{status="success"}[5m]) / rate(protein_docking_jobs_completed_total[5m]) * 100
        labels:
          metric_type: "reliability"
          priority: "critical"

      # Score promedio de docking (calidad de resultados)
      - record: protein_docking:avg_docking_score
        expr: avg(protein_docking_result_score) by (instance)
        labels:
          metric_type: "quality"
          priority: "medium"

  # Métricas de sistema y recursos
  - name: system_performance
    interval: 10s
    rules:
      # IOPS promedio (crítico para carga de proteínas)
      - record: system:disk_iops
        expr: rate(node_disk_reads_completed_total[1m]) + rate(node_disk_writes_completed_total[1m])
        labels:
          metric_type: "storage"
          priority: "medium"

      # Ancho de banda de red
      - record: system:network_bandwidth_mbps
        expr: (rate(node_network_receive_bytes_total[1m]) + rate(node_network_transmit_bytes_total[1m])) * 8 / 1024 / 1024
        labels:
          metric_type: "network"
          priority: "medium"

      # Load average normalizado
      - record: system:load_normalized
        expr: node_load1 / on(instance) count(node_cpu_seconds_total{mode="idle"}) by (instance)
        labels:
          metric_type: "load"
          priority: "medium"

  # Métricas de cache y base de datos
  - name: cache_database_performance
    interval: 15s
    rules:
      # Redis hit rate
      - record: redis:cache_hit_rate
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) * 100
        labels:
          metric_type: "cache"
          priority: "high"

      # PostgreSQL query performance
      - record: postgres:avg_query_time_ms
        expr: rate(pg_stat_database_tup_returned_total[5m]) / rate(pg_stat_database_numbackends[5m]) * 1000
        labels:
          metric_type: "database"
          priority: "medium"

      # ClickHouse query rate
      - record: clickhouse:queries_per_second
        expr: rate(clickhouse_query_total[1m])
        labels:
          metric_type: "analytics"
          priority: "low"

  # Métricas de algoritmos específicos
  - name: algorithm_performance
    interval: 5s
    rules:
      # SIMD operations per second
      - record: algorithms:simd_ops_per_second
        expr: rate(protein_docking_simd_operations_total[1m])
        labels:
          metric_type: "computation"
          priority: "high"

      # Spatial index search time
      - record: algorithms:spatial_search_time_ms
        expr: histogram_quantile(0.95, rate(protein_docking_spatial_search_duration_seconds_bucket[5m])) * 1000
        labels:
          metric_type: "computation"
          priority: "high"
          quantile: "95"

      # Memory pool efficiency
      - record: algorithms:memory_pool_efficiency
        expr: (protein_docking_memory_pool_allocated_bytes / protein_docking_memory_pool_total_bytes) * 100
        labels:
          metric_type: "memory"
          priority: "medium"

      # GPU kernel execution time
      - record: algorithms:gpu_kernel_time_ms
        expr: histogram_quantile(0.90, rate(protein_docking_gpu_kernel_duration_seconds_bucket[5m])) * 1000
        labels:
          metric_type: "gpu"
          priority: "high"
          quantile: "90"

  # SLA y Business Metrics
  - name: sla_metrics
    interval: 30s
    rules:
      # SLA de tiempo de respuesta (< 10 segundos para jobs simples)
      - record: sla:response_time_sla
        expr: histogram_quantile(0.95, rate(protein_docking_job_duration_seconds_bucket{job_type="simple"}[5m])) < 10
        labels:
          metric_type: "sla"
          priority: "critical"
          sla_target: "10s"

      # SLA de disponibilidad (99.9% uptime)
      - record: sla:availability_percent
        expr: avg_over_time(up{job="protein-docking-backend"}[5m]) * 100
        labels:
          metric_type: "sla"
          priority: "critical"
          sla_target: "99.9"

      # SLA de throughput (> 100 jobs/hora)
      - record: sla:throughput_sla
        expr: rate(protein_docking_jobs_completed_total[1h]) * 3600 > 100
        labels:
          metric_type: "sla"
          priority: "critical"
          sla_target: "100_jobs_per_hour"

  # Métricas predictivas y trending
  - name: predictive_metrics
    interval: 60s
    rules:
      # Tendencia de uso de memoria (predicción para próxima hora)
      - record: prediction:memory_usage_trend
        expr: predict_linear(protein_docking:memory_usage_percent[30m], 3600)
        labels:
          metric_type: "prediction"
          horizon: "1h"

      # Tendencia de carga de trabajo
      - record: prediction:workload_trend
        expr: predict_linear(protein_docking:jobs_per_second[1h], 3600)
        labels:
          metric_type: "prediction"
          horizon: "1h"

      # Predicción de saturación de GPU
      - record: prediction:gpu_saturation_risk
        expr: predict_linear(protein_docking:gpu_utilization_avg[30m], 1800) > 90
        labels:
          metric_type: "prediction"
          alert_type: "saturation"
          horizon: "30m"