# Default values for protein-docking
# AGENTE 4: DevOps & Infrastructure Specialist

# Global configuration
global:
  imageRegistry: ghcr.io
  repository: protein-docking
  pullPolicy: IfNotPresent
  storageClass: fast-ssd

# Environment configuration
environment: production

# Replica counts
replicaCount:
  backend: 3
  frontend: 2
  worker: 2

# Image configuration
image:
  backend:
    repository: protein-docking-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: protein-docking-frontend  
    tag: latest
    pullPolicy: IfNotPresent
  backendGpu:
    repository: protein-docking-backend-gpu
    tag: latest-gpu
    pullPolicy: IfNotPresent

# Service configuration
service:
  backend:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  frontend:
    type: ClusterIP
    port: 3000
    targetPort: 3000

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: protein-docking.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: protein-docking-tls
      hosts:
        - protein-docking.example.com

# GPU configuration
gpu:
  enabled: false
  nodeSelector:
    nvidia.com/gpu: "true"
  resources:
    limits:
      nvidia.com/gpu: 1
  runtime: nvidia

# Resource limits
resources:
  backend:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 2000m
      memory: 4Gi
  frontend:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  backendGpu:
    limits:
      cpu: 8000m
      memory: 16Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1

# Autoscaling
autoscaling:
  backend:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Database configuration
postgresql:
  enabled: true
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: fast-ssd
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 2000m
        memory: 4Gi
  auth:
    database: protein_docking
    username: protein_user
    existingSecret: postgres-credentials

# Redis configuration  
redis:
  enabled: true
  architecture: replication
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd

# Storage configuration
persistence:
  uploads:
    enabled: true
    size: 500Gi
    storageClass: fast-ssd
    accessMode: ReadWriteMany
  results:
    enabled: true
    size: 1Ti
    storageClass: nvme-ssd
    accessMode: ReadWriteMany
  cache:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
    accessMode: ReadWriteOnce

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor: true
    rules: true
  grafana:
    enabled: true
    dashboards: true
  alerts:
    enabled: true
    slack:
      webhook: ""
      channel: "#protein-docking-alerts"

# Security configuration
security:
  networkPolicies:
    enabled: true
  podSecurityPolicy:
    enabled: true
  rbac:
    enabled: true
  secrets:
    jwt:
      secretName: jwt-secret
      key: secret
    database:
      secretName: postgres-credentials
    registry:
      secretName: registry-credentials

# Node affinity and tolerations
nodeAffinity:
  backend:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: node-type
            operator: In
            values: ["compute"]
  frontend:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: node-type
            operator: In
            values: ["frontend"]

tolerations:
  gpu:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# Pod disruption budgets
podDisruptionBudget:
  backend:
    enabled: true
    minAvailable: 2
  frontend:
    enabled: true
    minAvailable: 1

# Health checks
healthChecks:
  backend:
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  frontend:
    livenessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# Environment variables
env:
  backend:
    RUST_LOG: "info,protein_docking_backend=debug"
    TOKIO_WORKER_THREADS: "16"
    RAYON_NUM_THREADS: "16"
    PROTEIN_DOCKING_ENABLE_GPU: "false"
    PROTEIN_DOCKING_ENABLE_SIMD: "true"
    PROTEIN_DOCKING_MAX_CONCURRENT_JOBS: "8"
    PROTEIN_DOCKING_MEMORY_POOL_SIZE: "4GB"
  frontend:
    NODE_ENV: "production"
    VITE_ENABLE_ANALYTICS: "true"
    VITE_ENABLE_PWA: "true"

# GPU-specific environment variables
envGpu:
  backend:
    CUDA_VISIBLE_DEVICES: "0"
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    PROTEIN_DOCKING_ENABLE_GPU: "true"
    PROTEIN_DOCKING_ENABLE_CUDA: "true"
    PROTEIN_DOCKING_GPU_BATCH_SIZE: "1024"
    GPU_MEMORY_FRACTION: "0.8"